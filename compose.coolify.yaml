# Deploy with Coolify's Docker Compose build pack.
#
# Panel-managed game servers are NOT part of this stack: create or attach
# LauncherDockered installations from the panel UI. Each installation runs the
# official ghcr.io/gravitlauncher/launcher image and publishes its own nginx
# facade on the Docker host (port 17549 by default). Route your game domain to
# that host port — see README.md, "Game domain routing" — and keep
# REMOTE_CONTROL_ENDPOINT pointed at it. The optional stock `launchserver`
# service at the bottom is unmanaged and bound to the host loopback only.
#
# Data lives at a fixed absolute host path because Coolify rejects variable
# interpolation in bind-mount paths as a command-injection safeguard. Do not
# replace this bind mount with a named volume: the panel starts nested Compose
# projects and Docker must resolve their bind mounts on the host.
#
# Coolify provides the following magic variables:
#   SERVICE_REALBASE64_32_GRAVITPANEL — stable base64 32-byte encryption key
#   SERVICE_FQDN_PANELWEB             — auto-generated FQDN for the web service
name: gravit-panel

services:
  api:
    image: ${PANEL_API_IMAGE:-ghcr.io/badtochka/gravit-panel-api:latest}
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /data/gravit-panel/gravit-panel.sqlite
      INSTALLATIONS_ROOT: /data/gravit-panel/installations
      MODULE_ARTIFACTS_DIR: /data/gravit-panel/modules
      # The installation's nginx facade publishes port 17549 on the Docker host.
      REMOTE_CONTROL_ENDPOINT: http://host.docker.internal:17549
      CREDENTIAL_ENCRYPTION_KEY: ${SERVICE_REALBASE64_32_GRAVITPANEL}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # PANEL_PUBLIC_URL is the single source of truth for the panel's
      # public address. Its path component drives the SPA sub-route and
      # OAuth callback URI. PANEL_PUBLIC_PATH is an optional override
      # for edge cases where the proxy strips a different prefix.
      PANEL_AUTH_MODE: discord
      PANEL_PUBLIC_URL: https://${SERVICE_FQDN_PANELWEB}${PANEL_PUBLIC_PATH:-}
      PANEL_DISCORD_CLIENT_ID: ${PANEL_DISCORD_CLIENT_ID:?Set the Discord OAuth2 client ID}
      PANEL_DISCORD_CLIENT_SECRET: ${PANEL_DISCORD_CLIENT_SECRET:?Set the Discord OAuth2 client secret}
      PANEL_DISCORD_ALLOWED_USER_IDS: ${PANEL_DISCORD_ALLOWED_USER_IDS:?Set at least one allowed Discord user ID}
      PANEL_AUTH_COOKIE_SECURE: 'true'
    volumes:
      - type: bind
        source: /data/gravit-panel
        target: /data/gravit-panel
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"const response = await fetch('http://127.0.0.1:3000/api/health'); process.exit(response.ok ? 0 : 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: ${PANEL_WEB_IMAGE:-ghcr.io/badtochka/gravit-panel-web:latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"
    environment:
      SERVICE_URL_PANELWEB_80: ${PANEL_PUBLIC_PATH:-/}
      # The web container derives the SPA sub-path from PANEL_PUBLIC_URL.
      # PANEL_PUBLIC_PATH is supplied as an explicit override.
      PANEL_PUBLIC_URL: https://${SERVICE_FQDN_PANELWEB}${PANEL_PUBLIC_PATH:-}
      PANEL_PUBLIC_PATH: ${PANEL_PUBLIC_PATH:-}
    labels:
      - "traefik.http.middlewares.gravit-panel-trailing.redirectregex.regex=^https?://([^/]+)${PANEL_PUBLIC_PATH:-/__gravit-panel-disabled__}$$"
      - "traefik.http.middlewares.gravit-panel-trailing.redirectregex.replacement=https://$${1}${PANEL_PUBLIC_PATH:-/__gravit-panel-disabled__}/"
      - "traefik.http.middlewares.gravit-panel-trailing.redirectregex.permanent=true"
      - "traefik.http.middlewares.gravit-panel-strip.stripprefix.prefixes=${PANEL_PUBLIC_PATH:-/__gravit-panel-disabled__}"
      - "coolify.traefik.middlewares=gravit-panel-trailing@docker,gravit-panel-strip@docker"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Optional standalone stock LaunchServer. The panel does NOT manage it;
  # managed game servers are LauncherDockered installations created from the
  # panel UI. Intentionally exposed only on the host loopback: assign no domain
  # to it in Coolify, and proxy a game domain to 127.0.0.1:9274 manually if you
  # actually use it (WebSocket upgrade required). Its netty port serves the
  # launcher API and, when fileServerEnabled, the update files directly.
  launchserver:
    image: ${LAUNCHSERVER_IMAGE:-ghcr.io/gravitlauncher/launcher:v5.7.9}
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment:
      ADDRESS: ${LAUNCHSERVER_ADDRESS:-localhost:9274}
      PROJECTNAME: ${LAUNCHSERVER_PROJECT_NAME:-main}
      JAVA_OPTS: ${LAUNCHSERVER_JAVA_OPTS:-}
    ports:
      - "127.0.0.1:${LAUNCHSERVER_PORT:-9274}:9274"
    volumes:
      - type: bind
        source: /data/gravit-panel/launchserver
        target: /app/data
