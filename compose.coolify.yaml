# Deploy this file with Coolify's Docker Compose build pack. Configure the
# Data lives at a fixed absolute host path because Coolify rejects variable
# interpolation in bind-mount paths as a command-injection safeguard. Do not
# replace this bind mount with a named volume: the panel starts nested Compose
# projects and Docker must resolve their bind mounts on the host.
name: gravit-panel

services:
  api:
    image: ${PANEL_API_IMAGE:-ghcr.io/badtochka/gravit-panel-api:latest}
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /data/gravit-panel/gravit-panel.sqlite
      INSTALLATIONS_ROOT: /data/gravit-panel/installations
      MODULE_ARTIFACTS_DIR: /data/gravit-panel/modules
      # Coolify generates a stable base64-encoded 32-byte key per resource.
      CREDENTIAL_ENCRYPTION_KEY: ${SERVICE_REALBASE64_32_GRAVITPANEL}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      PANEL_AUTH_MODE: discord
      PANEL_AUTH_REDIRECT_URI: https://${SERVICE_FQDN_PANELWEB}/api/panel-auth/callback
      PANEL_DISCORD_CLIENT_ID: ${PANEL_DISCORD_CLIENT_ID:?Set the Discord OAuth2 client ID}
      PANEL_DISCORD_CLIENT_SECRET: ${PANEL_DISCORD_CLIENT_SECRET:?Set the Discord OAuth2 client secret}
      PANEL_DISCORD_ALLOWED_USER_IDS: ${PANEL_DISCORD_ALLOWED_USER_IDS:?Set at least one allowed Discord user ID}
      PANEL_AUTH_COOKIE_SECURE: 'true'
    volumes:
      - type: bind
        source: /data/gravit-panel
        target: /data/gravit-panel
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"const response = await fetch('http://127.0.0.1:3000/api/health'); process.exit(response.ok ? 0 : 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  web:
    image: ${PANEL_WEB_IMAGE:-ghcr.io/badtochka/gravit-panel-web:latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"
    environment:
      # Creates the Coolify wildcard-domain route used by the panel OAuth callback.
      SERVICE_URL_PANELWEB_80: /
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  launchserver:
    image: ghcr.io/gravitlauncher/launcher:v5.7.9
    restart: unless-stopped
    stdin_open: true
    tty: true
    environment:
      # The generated FQDN is attached to launchserver-web below.
      ADDRESS: ${SERVICE_FQDN_LAUNCHSERVERWEB}
      PROJECTNAME: ${LAUNCHSERVER_PROJECT_NAME:-main}
      JAVA_OPTS: ${LAUNCHSERVER_JAVA_OPTS:-}
    volumes:
      - type: bind
        source: /data/gravit-panel/launchserver
        target: /app/data

  launchserver-web:
    image: ${PANEL_LAUNCHSERVER_WEB_IMAGE:-ghcr.io/badtochka/gravit-panel-launchserver-web:latest}
    restart: unless-stopped
    depends_on:
      launchserver:
        condition: service_started
    expose:
      - "80"
    environment:
      # Creates a Coolify wildcard-domain route to this service's port 80.
      SERVICE_URL_LAUNCHSERVERWEB_80: /
    volumes:
      - type: bind
        source: /data/gravit-panel/launchserver
        target: /volume
        read_only: true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
