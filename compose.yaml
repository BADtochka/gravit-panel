name: gravit-panel

# The panel manages exactly one LaunchServer in a LauncherDockered workspace.
# The `launchserver` service below is its stateless Compose-visible proxy: it
# gives Coolify and external reverse proxies a stable service target without
# creating a second runtime, data directory, or LaunchServer.json.

x-panel-data: &panel-data
  # Absolute path on the Docker host. Must exist before starting the project
  # and must be the same inside the container — LauncherDockered Compose
  # projects use relative bind mounts resolved by the host daemon.
  DATABASE_PATH: ${PANEL_DATA_DIR:-/data/gravit-panel}/gravit-panel.sqlite
  MODULE_ARTIFACTS_DIR: ${PANEL_DATA_DIR:-/data/gravit-panel}/modules
  INSTALLATIONS_ROOT: ${PANEL_DATA_DIR:-/data/gravit-panel}/installations

services:
  # ------------------------------------------------------------------
  # API — Bun + Elysia server. Manages LaunchServer, modules, and builds.
  # ------------------------------------------------------------------
  api:
    image: ${PANEL_API_IMAGE:-ghcr.io/badtochka/gravit-panel-api:latest}
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      <<: *panel-data
      # Both API and public traffic use the same Compose-visible facade.
      REMOTE_CONTROL_ENDPOINT: ${REMOTE_CONTROL_ENDPOINT:-http://launchserver}
      LAUNCHSERVER_PUBLIC_ADDRESS: ${LAUNCHSERVER_PUBLIC_ADDRESS:-localhost:9274}
      CREDENTIAL_ENCRYPTION_KEY: ${CREDENTIAL_ENCRYPTION_KEY:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # Panel auth. Set PANEL_AUTH_MODE=discord and configure the OAuth
      # variables to enable Discord-based panel authentication.
      PANEL_AUTH_MODE: ${PANEL_AUTH_MODE:-disabled}
      PANEL_PUBLIC_URL: ${PANEL_PUBLIC_URL:-}
      PANEL_DISCORD_CLIENT_ID: ${PANEL_DISCORD_CLIENT_ID:-}
      PANEL_DISCORD_CLIENT_SECRET: ${PANEL_DISCORD_CLIENT_SECRET:-}
      PANEL_DISCORD_ALLOWED_USER_IDS: ${PANEL_DISCORD_ALLOWED_USER_IDS:-}
      PANEL_AUTH_COOKIE_SECURE: ${PANEL_AUTH_COOKIE_SECURE:-true}
      SERVER_PACK_MAX_FILE_BYTES: ${SERVER_PACK_MAX_FILE_BYTES:-268435456}
      SERVER_PACK_MAX_BYTES: ${SERVER_PACK_MAX_BYTES:-4294967296}
    depends_on:
      launchserver:
        condition: service_healthy
    volumes:
      - type: bind
        source: ${PANEL_DATA_DIR:-/data/gravit-panel}
        target: ${PANEL_DATA_DIR:-/data/gravit-panel}
      - type: bind
        source: /var/run/docker.sock
        target: /var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD-SHELL", "bun -e \"const response = await fetch('http://127.0.0.1:3000/api/health'); process.exit(response.ok ? 0 : 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ------------------------------------------------------------------
  # Web — nginx that serves the Vue SPA and proxies /api/ to the API.
  # ------------------------------------------------------------------
  web:
    image: ${PANEL_WEB_IMAGE:-ghcr.io/badtochka/gravit-panel-web:latest}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PANEL_PORT:-8080}:80"
    environment:
      # PANEL_PUBLIC_URL is the single source of truth for deriving
      # the SPA sub-path. PANEL_PUBLIC_PATH is an optional override
      # when the proxy strips a different prefix than the URL path.
      PANEL_PUBLIC_URL: ${PANEL_PUBLIC_URL:-}
      PANEL_PUBLIC_PATH: ${PANEL_PUBLIC_PATH:-}
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ------------------------------------------------------------------
  # LaunchServer facade — stable Compose target for the one managed server.
  # The actual runtime remains in the panel-managed LauncherDockered workspace
  # and publishes its nginx facade on host port 17549.
  # ------------------------------------------------------------------
  launchserver:
    image: nginx:stable-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LAUNCHSERVER_PROXY_PORT:-9274}:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - /bin/sh
      - -ec
      - |
        cat > /etc/nginx/conf.d/default.conf <<'NGINX'
        map $$http_upgrade $$connection_upgrade {
            default upgrade;
            ''      close;
        }

        map $$http_x_forwarded_proto $$launcher_forwarded_proto {
            default $$http_x_forwarded_proto;
            ''      $$scheme;
        }

        server {
            listen 80 default_server;
            server_name _;

            location = /healthz {
                access_log off;
                default_type text/plain;
                return 200 "ok\n";
            }

            location / {
                proxy_pass http://host.docker.internal:17549;
                proxy_http_version 1.1;
                proxy_set_header Upgrade $$http_upgrade;
                proxy_set_header Connection $$connection_upgrade;
                proxy_set_header Host $$host;
                proxy_set_header X-Real-IP $$remote_addr;
                proxy_set_header X-Forwarded-Proto $$launcher_forwarded_proto;
                proxy_set_header X-Forwarded-For $$proxy_add_x_forwarded_for;
                proxy_read_timeout 3600s;
                proxy_send_timeout 3600s;
            }
        }
        NGINX
        exec nginx -g 'daemon off;'
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 5s
