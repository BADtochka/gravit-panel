server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 64m;

    # Job logs use Server-Sent Events. Buffering would delay their delivery.
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
    }

    # Traefik StripPrefix preserves the public path in this header. Redirect a
    # bare subroute such as /panel to /panel/ so relative Vite assets resolve
    # below that path instead of at the host root.
    location = / {
        if ($http_x_forwarded_prefix != "") {
            return 308 $http_x_forwarded_prefix/;
        }
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
