upstream launchserver {
    server launchserver:9274;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

# Coolify terminates TLS before this container. Keep the original scheme so
# LaunchServer generates https:// and wss:// URLs rather than redirecting a
# launcher WebSocket from ws:// to wss://.
map $http_x_forwarded_proto $launcher_forwarded_proto {
    default $http_x_forwarded_proto;
    '' $scheme;
}

server {
    listen 80;
    server_name _;
    charset utf-8;
    # The updates directory itself is the document root: artifact and profile
    # URLs are root-relative to it (e.g. /Launcher.jar, /<profile>/client.jar).
    root /volume/updates;

    location = / {
        default_type text/plain;
        return 200 "LaunchServer is online\n";
    }

    location = /healthz {
        access_log off;
        return 200;
    }

    location /api {
        proxy_pass http://launchserver;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $launcher_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /webapi/ {
        proxy_pass http://launchserver/webapi/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $launcher_forwarded_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # Tolerate URLs that still carry the updates-dir prefix from configs
    # generated before path normalization ("/updates/Launcher.jar").
    # Without this alias they would resolve to "<updates>/updates/..." and 404.
    location /updates/ {
        alias /volume/updates/;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
